name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar versão no system.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' system.json > tmp.json && mv tmp.json system.json
      - name: Gerar zip
        run: zip -r system.zip system.json README.md LICENSE-NOTICE.md scripts styles templates lang
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            system.json
            system.zip
