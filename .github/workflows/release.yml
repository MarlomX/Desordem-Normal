name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar versão no module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' module.json > tmp.json && mv tmp.json module.json
      - name: Gerar zip
        run: zip -r module.zip module.json README.md LICENSE-NOTICE.md scripts styles templates lang
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
